[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-data-footprint"
dynamic = ["version"]
description = "Daily and monthly flux footprint rasters for eddy covariance towers using the Kljun et al. (2015) FFP model."
readme = "README.rst"
# Apache-2.0 for the package, ISC for N. Kljun's FFP model code (ffp.py)
license = "Apache-2.0 AND ISC"
license-files = ["LICENSE", "fluxfootprint/FFP_LICENSE.txt"]
authors = [{name = "John Volk", email = "John.Volk@dri.edu"}]
requires-python = ">=3.9"
# numpy 2.4 breaks float() on 1-element arrays used in ffp.py and
# refet 0.5 renamed calcs._actual_vapor_pressure used for NLDAS ETo
dependencies = [
    "affine",
    "matplotlib>=2.0",
    "numpy>=1.20.0,<2.4",
    "pandas>=2.0",
    "pyproj>=3.0",
    "rasterio>=1.0",
    "refet>=0.3,<0.5",
    "requests",
    "scipy>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=6.2.2"]

[project.urls]
Homepage = "https://github.com/Open-ET/flux-data-footprint"

[tool.setuptools]
packages = ["fluxfootprint"]

[tool.setuptools.dynamic]
version = {attr = "fluxfootprint.__version__"}

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
exclude = "venv"

[tool.mypy]
python_version = 3.8
strict_optional = true
